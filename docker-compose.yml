name: water-triage
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-water-triage}-db
    environment:
      POSTGRES_DB: analysis
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-LocalAnalysis2026}
    ports: ["${DB_PORT:-17708}:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U app -d analysis"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-water-triage}-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-water-triage}-backend
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://app:${DB_PASSWORD:-LocalAnalysis2026}@db:5432/analysis
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-water-triage-development-only}
      SEED_DEMO: ${SEED_DEMO:-true}
      ARTIFACT_DIR: /artifacts
      STATION_URL: http://station:8010
      STATION_TIMEOUT: ${STATION_TIMEOUT:-4}
      STATION_DRILL_TOKEN: ${STATION_DRILL_TOKEN:-station-drill-token}
      STATION_RETRY_BASE: ${STATION_RETRY_BASE:-30}
      STATION_VERIFY_DEADLINE: ${STATION_VERIFY_DEADLINE:-86400}
    ports: ["${BACKEND_PORT:-19208}:8000"]
    volumes: ["analysis-artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 4s
      timeout: 3s
      retries: 35
      start_period: 15s
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-water-triage}-worker
    command: ["python", "-m", "src.worker"]
    environment: *app-env
    volumes: ["analysis-artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/heartbeat')<30"]
      interval: 5s
      timeout: 3s
      retries: 20
  station:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-water-triage}-station
    command: ["uvicorn","src.station.app:app","--host","0.0.0.0","--port","8010"]
    environment:
      STATION_INBOX: /station-inbox
      STATION_DRILL_TOKEN: ${STATION_DRILL_TOKEN:-station-drill-token}
      STATION_SLOW_DELAY: ${STATION_SLOW_DELAY:-6}
    ports: ["${STATION_PORT:-19308}:8010"]
    volumes: ["station-inbox:/station-inbox"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 4s
      timeout: 3s
      retries: 30
      start_period: 10s
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-water-triage}-frontend
    ports: ["${FRONTEND_PORT:-18208}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 4s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  redis-data:
  analysis-artifacts:
  station-inbox:
